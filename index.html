<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Какая вы чашечка? — Farforello</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FAF8F5; font-family: 'Jost', sans-serif; color: #2C2C2A; min-height: 100vh; }
.qw { max-width: 640px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.qhdr { text-align: center; margin-bottom: 2.5rem; padding-top: 1rem; }
.brand { font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; color: #888780; margin-bottom: 0.75rem; }
.qtitle { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 400; line-height: 1.2; margin-bottom: 0.6rem; }
.qtitle em { font-style: italic; }
.qsub { font-size: 14px; font-weight: 300; color: #888780; line-height: 1.7; }
.pbar { height: 1.5px; background: #E0DDD7; border-radius: 2px; margin-bottom: 2rem; overflow: hidden; }
.pfill { height: 100%; background: #8B7355; border-radius: 2px; transition: width 0.5s ease; }
.slbl { font-size: 11px; color: #B4B2A9; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1.25rem; }
.qtext { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; line-height: 1.4; margin-bottom: 2rem; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.obtn { background: #fff; border: 0.5px solid #D3D1C7; border-radius: 10px; padding: 15px 20px; text-align: left; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300; color: #2C2C2A; transition: border-color 0.15s, background 0.15s; line-height: 1.55; }
.obtn:hover { border-color: #8B7355; background: #F5F2ED; }
.obtn.flash { border-color: #8B7355; background: #8B7355; color: #fff; transition: none; }
.sbtn { margin-top: 2rem; background: #8B7355; color: #fff; border: none; border-radius: 10px; padding: 16px 32px; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 400; cursor: pointer; letter-spacing: 0.06em; transition: opacity 0.2s; width: 100%; }
.sbtn:hover { opacity: 0.86; }

.rcard {
  border: 0.5px solid #D3D1C7;
  border-radius: 18px;
  background: #fff;
  overflow: hidden;
  position: relative;
}
.rcard-bg {
  position: relative;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.rcard-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: var(--bg-img);
  background-size: cover;
  background-position: center;
  opacity: 0.18;
  border-radius: 18px 18px 0 0;
}
.rcard-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.85) 65%, rgba(255,255,255,1) 100%);
  border-radius: 18px 18px 0 0;
}
.rcontent {
  position: relative;
  z-index: 2;
  padding: 2.5rem 2rem 2rem;
  text-align: center;
}
.rtype { font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: #888780; margin-bottom: 0.5rem; }
.rname { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 400; line-height: 1.2; margin-bottom: 0.4rem; color: #2C2C2A; }
.rtag { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: #888780; margin-bottom: 1.5rem; }
.rdesc { font-size: 15px; font-weight: 300; line-height: 1.85; color: #2C2C2A; margin-bottom: 1rem; text-align: left; }
.rps { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #7B2D3E; line-height: 1.6; text-align: center; }
.divdr { height: 0.5px; background: #E0DDD7; margin: 1.75rem 0; }
.scta { font-size: 13px; color: #888780; margin-bottom: 1rem; font-weight: 300; }
.tgbtn { display: block; text-align: center; background: #8B7355; color: #fff; text-decoration: none; border-radius: 10px; padding: 14px 28px; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 400; letter-spacing: 0.06em; transition: opacity 0.2s; margin-bottom: 10px; }
.tgbtn:hover { opacity: 0.85; }
.sharebtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: none; border: 0.5px solid #D3D1C7; border-radius: 10px; padding: 13px 28px; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 300; color: #2C2C2A; cursor: pointer; letter-spacing: 0.04em; transition: border-color 0.2s, background 0.2s; }
.sharebtn:hover { border-color: #8B7355; background: #F5F2ED; }
.sharebtn svg { flex-shrink: 0; }
.share-toast { display: none; text-align: center; font-size: 13px; color: #8B7355; font-family: 'Cormorant Garamond', serif; font-style: italic; margin-top: 10px; }
.rtrbtn { background: none; border: none; font-family: 'Jost', sans-serif; font-size: 13px; color: #888780; cursor: pointer; font-weight: 300; text-decoration: underline; text-underline-offset: 3px; margin-top: 1.25rem; }
.fade-in { animation: fi 0.4s ease; }
@keyframes fi { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>

  { img:'espresso', name:"Чашка для эспрессо", tagline:"Маленькая, но заряжает на весь день", desc:"Концентрированная и точная. Вы не тратите время на лишнее — только суть. Умеете за 5 минут сделать то, на что другие тратят час. Вас уважают, иногда побаиваются, и всегда зовут, когда надо что-то решить.", ps:"P.S. Вы наверняка читаете письма по диагонали и всё равно отвечаете точнее всех.", product:"Кофейные пары и эспрессо-чашки" },
  { img:'painted', name:"Фарфоровая чашка с росписью", tagline:"Красота — это не роскошь, а необходимость", desc:"Вы замечаете детали, которые другие просто проходят мимо. Правильно выбранная чашка для вас — это маленькое произведение искусства. Вы умеете создавать красоту вокруг себя — и это заразительно.", ps:"P.S. Вы фотографируете сервировку до того, как сесть за стол. И правильно делаете.", product:"Расписной фарфор и авторские чашки" },
  { img:'bowl', name:"Пиала для чая", tagline:"Каждый день — новое открытие", desc:"Вы из тех, кто пробует всё новое первым — и потом рассказывает остальным. Вас привлекает необычное: нетипичный вкус, редкая форма, история предмета. Скучно вам не бывает — и с вами тоже.", ps:"P.S. Вы уже прочитали описание чая на пачке, пока он заваривается. Оба раза.", product:"Необычные формы и авторские пиалы" }
];

let currentQ=0, scores=[0,0,0,0,0], blocked=false, lastResult=null;
function el() { return document.getElementById('app'); }

function renderStart() {
  el().innerHTML = `<div class="qhdr fade-in">
    <div class="brand">Farforello</div>
    <div class="qtitle">Какая вы <em>чашечка?</em></div>
    <p class="qsub">5 вопросов о характере — и мы найдём вашу идеальную пару среди нашего фарфора</p>
    <br><button class="sbtn" onclick="startQuiz()">Начать тест</button>
  </div>`;
}

function startQuiz() { currentQ=0; scores=[0,0,0,0,0]; blocked=false; renderQuestion(); }

function renderQuestion() {
  blocked=false;
  const q=questions[currentQ];
  const pct=(currentQ/questions.length)*100;
  el().innerHTML=`<div class="fade-in">
    <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    <div class="slbl">Вопрос ${currentQ+1} из ${questions.length}</div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="obtn" onclick="selectOpt(${i})" id="opt${i}">${o.text}</button>`).join('')}</div>
  </div>`;
}

function selectOpt(i) {
  if(blocked) return;
  blocked=true;
  document.getElementById('opt'+i).classList.add('flash');
  setTimeout(()=>{
    questions[currentQ].opts[i].scores.forEach((s,j)=>scores[j]+=s);
    currentQ++;
    if(currentQ>=questions.length) renderResult(); else renderQuestion();
  },500);
}

function shareResult() {
  const r = lastResult;
  const text = `Я прошла тест «Какая вы чашечка?» от Farforello и оказалась — ${r.name}! "${r.tagline}" ☕ Узнай свою чашечку: https://t.me/farforello`;
  if (navigator.share) {
    navigator.share({ text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>{
      const toast = document.getElementById('share-toast');
      if(toast) { toast.style.display='block'; setTimeout(()=>toast.style.display='none', 3000); }
    });
  }
}

function renderResult() {
  const r=results[scores.indexOf(Math.max(...scores))];
  lastResult = r;
  const bgImg = IMGS[r.img];
  el().innerHTML=`<div class="fade-in">
    <div class="qhdr"><div class="brand">Farforello — ваш результат</div></div>
    <div class="rcard">
      <div class="rcard-bg" style="--bg-img: url('${bgImg}')">
        <div class="rcontent">
          <div class="rtype">Вы — это</div>
          <div class="rname">${r.name}</div>
          <div class="rtag">${r.tagline}</div>
          <p class="rdesc">${r.desc}</p>
          <p class="rps">${r.ps}</p>
          <div class="divdr"></div>
          <p class="scta">Вам может понравиться: <strong>${r.product}</strong></p>
          <a href="https://t.me/farforello" class="tgbtn">Смотреть в Farforello →</a>
          <button class="sharebtn" onclick="shareResult()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Поделиться результатом
          </button>
          <div id="share-toast" class="share-toast">Текст скопирован — вставьте в любой мессенджер ✓</div>
        </div>
      </div>
    </div>
    <div style="text-align:center;"><button class="rtrbtn" onclick="renderStart()">Пройти снова</button></div>
  </div>`;
}

renderStart();
</script>
</body>
</html>
